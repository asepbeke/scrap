<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F"/>
      <stop offset="50%" stop-color="#11151D"/>
      <stop offset="100%" stop-color="#171C27"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="640" height="360" fill="url(#bg)"/>
  
  <!-- Subtle Ambient Glow Ring -->
  <circle cx="320" cy="160" r="100" fill="#8B5CF6" opacity="0.08" filter="blur(30px)"/>

  <!-- Play Circle Icon with Violet/Cyan Gradient -->
  <circle cx="320" cy="160" r="44" fill="url(#glow)" filter="url(#shadow)"/>
  <polygon points="312,142 336,160 312,178" fill="#ffffff"/>

  <!-- Typography Labels -->
  <text x="320" y="240" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="2">
    STREAMVAULT PREMIERE
  </text>
  <text x="320" y="262" fill="#9CA3AF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" text-anchor="middle">
    High Definition Cinema Stream
  </text>
</svg>
